{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width: 600px; margin: 20px auto;">
    <h2 class="card-header-title"><i class="fa-solid fa-user-pen"></i> ویرایش پروفایل</h2>
    <form method="post">
        {% csrf_token %}
        <div class="form-group" style="margin-bottom: 15px;">
            <label>نام:</label>
            <input type="text" name="first_name" value="{{ user.first_name }}">
        </div>
        <div class="form-group" style="margin-bottom: 15px;">
            <label>نام خانوادگی:</label>
            <input type="text" name="last_name" value="{{ user.last_name }}">
        </div>
        <div class="form-group" style="margin-bottom: 15px;">
            <label>ایمیل:</label>
            <input type="email" name="email" value="{{ user.email }}">
        </div>
        <button type="submit" class="btn btn-success"><i class="fa-solid fa-check"></i> ذخیره تغییرات</button>
    </form>
</div>
{% endblock %}
