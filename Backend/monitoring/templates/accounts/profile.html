{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width: 600px; margin: 20px auto;">
    <h2 class="card-header-title"><i class="fa-solid fa-user"></i> پروفایل کاربری</h2>
    <div style="line-height: 2;">
        <p><strong>نام کاربری:</strong> {{ user.username }}</p>
        <p><strong>ایمیل:</strong> {{ user.email }}</p>
        <p><strong>نام و نام خانوادگی:</strong> {{ user.get_full_name|default:"ثبت نشده" }}</p>
    </div>
    <div style="margin-top: 20px; display: flex; gap: 10px;">
        <a href="{% url 'profile_edit' %}" class="btn btn-purple"><i class="fa-solid fa-user-pen"></i> ویرایش پروفایل</a>
        <a href="{% url 'change_password' %}" class="btn btn-info"><i class="fa-solid fa-key"></i> تغییر رمز عبور</a>
    </div>
</div>
{% endblock %}
